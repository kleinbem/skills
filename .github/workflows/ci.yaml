name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Required check (github-config): a broken skill reaches every agent in the
  # fleet with the next nix-config lock bump, so nothing merges without it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Skill structure
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-skills.py
      - name: Marketplace and plugins
        run: npx --yes @anthropic-ai/claude-code@2.1.303 plugin validate .
